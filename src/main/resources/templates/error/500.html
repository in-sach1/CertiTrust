<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/public :: pub(~{::title}, ~{::main})}">
<head><title>500 - Something went wrong | CertiTrust</title></head>
<body>
<main class="container text-center py-5" style="max-width:640px">
    <div class="error-code text-gradient">500</div>
    <h1 class="h3 mt-3">Something went wrong</h1>
    <p class="text-muted">An unexpected error occurred on our side. It has been logged - please try again in a moment.</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
        <a class="btn btn-glow" th:href="@{/}"><i class="bi bi-house"></i> Home</a>
    </div>
</main>
</body>
</html>
