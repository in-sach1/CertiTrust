<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/public :: pub(~{::title}, ~{::main})}">
<head><title>Request problem | CertiTrust</title></head>
<body>
<main class="container text-center py-5" style="max-width:640px">
    <div class="error-code text-gradient" th:text="${status}">400</div>
    <h1 class="h3 mt-3">We could not process that request</h1>
    <p class="text-muted">Please check the address or the data you submitted and try again.</p>
    <div class="d-flex justify-content-center gap-2 mt-4"><a class="btn btn-glow" th:href="@{/}"><i class="bi bi-house"></i> Home</a></div>
</main>
</body>
</html>
