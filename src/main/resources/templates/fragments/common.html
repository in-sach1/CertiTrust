<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Flash messages (set with RedirectAttributes: flashSuccess / flashError) -->
<div th:fragment="flash">
    <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${flashSuccess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${flashError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- Pagination for pages without extra query parameters: ~{fragments/common :: pager(${page}, '/history')} -->
<nav th:fragment="pager(page, url)" th:if="${page.totalPages > 1}" class="mt-3" aria-label="Pages">
    <ul class="pagination pagination-sm justify-content-center mb-0 flex-wrap">
        <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}"><a class="page-link" th:href="@{${url}(page=${page.number - 1})}">Previous</a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number ? 'active' : ''}"><a class="page-link" th:href="@{${url}(page=${i})}" th:text="${i + 1}">1</a></li>
        <li class="page-item" th:classappend="${page.last ? 'disabled' : ''}"><a class="page-link" th:href="@{${url}(page=${page.number + 1})}">Next</a></li>
    </ul>
</nav>
</body>
</html>
