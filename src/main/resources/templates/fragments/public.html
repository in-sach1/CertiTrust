<!DOCTYPE html>
<html th:fragment="pub(title, content)" lang="en" data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CertiTrust - Verify Every Credential. Trust Every Certificate.">
    <title th:replace="${title}">CertiTrust</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top glass-nav">
    <div class="container">
        <a class="navbar-brand brand-mark" th:href="@{/}"><img th:src="@{/img/logo.svg}" alt="">Certi<span class="text-gradient">Trust</span></a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Menu">
            <i class="bi bi-list fs-2 text-white"></i>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/verify}">Verify Certificate</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/design}">Design</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
            </ul>
            <div class="d-flex gap-2" sec:authorize="isAnonymous()">
                <a class="btn btn-ghost" th:href="@{/login}">Login</a>
                <a class="btn btn-glow" th:href="@{/register}">Register</a>
            </div>
            <div class="d-flex gap-2" sec:authorize="isAuthenticated()">
                <a class="btn btn-glow" th:href="@{/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-ghost" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container page-top">
    <div th:replace="~{fragments/common :: flash}"></div>
</div>

<div th:replace="${content}"></div>

<footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <div><strong class="text-white">CertiTrust</strong> &middot; Verify Every Credential. Trust Every Certificate.</div>
        <div class="small">&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> CertiTrust &middot;
            <a th:href="@{/about}">About</a> &middot; <a th:href="@{/design}">Design</a> &middot; <a th:href="@{/contact}">Contact</a> &middot; <a th:href="@{/verify}">Verify</a></div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
